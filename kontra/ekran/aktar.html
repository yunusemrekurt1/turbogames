<!doctype html><meta charset="utf-8"><title>aktar</title>
<script>
(async()=>{
  const hedef='https://appstoreconnect.apple.com';
  if(window.parent===window) return;
  const ad=['inceleme_kredi','inceleme_pass','inceleme_araba_kontra_araba_svj','inceleme_araba_kontra_araba_chiron'];
  for(const a of ad){
    try{ const b=await (await fetch('inceleme/'+a+'.png')).arrayBuffer();
      window.parent.postMessage({ad:a+'.png', buf:b}, hedef, [b]); }
    catch(e){ window.parent.postMessage({hata:String(e)}, hedef); }
  }
  window.parent.postMessage({bitti:1}, hedef);
})();
</script>
