<!doctype html><meta charset="utf-8"><title>aktar</title>
<script>
(async()=>{
  const hedef='https://appstoreconnect.apple.com';
  const p=new URLSearchParams(location.search); const dil=(p.get('l')||'tr').replace(/[^a-z]/g,'');
  if(window.parent===window) return;
  window.parent.postMessage({ping:dil}, hedef);
  for(let i=1;i<=8;i++){
    try{ const b=await (await fetch(dil+'/ekran-'+i+'.png')).arrayBuffer();
      window.parent.postMessage({ad:'kontra_'+dil+'_ekran-'+i+'.png', buf:b}, hedef, [b]); }
    catch(e){ window.parent.postMessage({hata:String(e), i}, hedef); }
  }
  window.parent.postMessage({bitti:dil}, hedef);
})();
</script>
